[build-system]
requires = ["setuptools>72", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "etos_suite_runner"
dynamic = ["version"]
description = "ETOS Suite Runner"
authors = [{name = "Tobias Persson", email = "tobias.persson@axis.com"}]
license = { text  = "Apache License, Version 2.0" }
readme = "README.rst"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License"
]
requires-python = ">=3.13"
dependencies = [
    "packageurl-python~=0.11",
    "cryptography>=50.0.0,<51.0.0",
    # etos-lib version is determined by etos-environment-provider;
    # keep this as a loose lower bound to avoid diamond dependency conflicts.
    "etos_lib>=5.4.0,<6.0.0",
    "etos_environment_provider==5.5.3",
    "opentelemetry-api~=1.40",
    "opentelemetry-exporter-otlp~=1.40",
    "opentelemetry-sdk~=1.40",
]

[project.urls]
Documentation = "https://etos.readthedocs.io/"
Homepage = "https://github.com/eiffel-community/etos-suite-runner"
Repository = "https://github.com/eiffel-community/etos-suite-runner"

[project.optional-dependencies]
testing = ["pytest", "pytest-cov"]

[tool.black]
line-length = 100

[tool.build_sphinx]
source_dir = "docs"
build_dir = "build/sphinx"

[tool.devpi.upload]
no-vcs = 1
formats = "bdist_wheel"

[tool.flake8]
exclude = [".tox", "build", "dist", ".eggs", "docs/conf.py"]

[tool.pytest.ini_options]
addopts = "--cov etos_suite_runner --cov-report term-missing --verbose"
norecursedirs = ["dist", "build", ".tox"]
testpaths = ["tests"]

[tool.setuptools_scm] 
root = "../.."

[tool.setuptools.packages]
find = { where = ["src"], exclude = ["tests"] }
